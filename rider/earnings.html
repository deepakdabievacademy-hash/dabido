<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dabido Rider Earnings</title>

<link rel="stylesheet" href="../style.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#16a34a;
color:#fff;
padding:16px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
padding:15px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
text-align:center;
}

.amount{
font-size:32px;
font-weight:bold;
color:#16a34a;
margin-top:10px;
}

button{
width:100%;
padding:14px;
background:#16a34a;
color:#fff;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#15803d;
}

</style>

</head>

<body>

<header>

💰 Rider Earnings

</header>

<div class="container">

<div class="card">

<h2>Today's Earnings</h2>

<div class="amount" id="today">

₹0

</div>

</div>

<div class="card">

<h2>Weekly Earnings</h2>

<div class="amount" id="week">

₹0

</div>

</div>

<div class="card">

<h2>Monthly Earnings</h2>

<div class="amount" id="month">

₹0

</div>

</div>

<div class="card">

<h2>Total Rides</h2>

<div class="amount" id="rides">

0

</div>

</div>

<button onclick="withdrawMoney()">

Withdraw Earnings

</button>

</div>

<script>

function loadData(){

let today=parseInt(localStorage.getItem("todayEarning"))||0;

let week=parseInt(localStorage.getItem("weekEarning"))||today;

let month=parseInt(localStorage.getItem("monthEarning"))||week;

let rides=parseInt(localStorage.getItem("totalRides"))||0;

document.getElementById("today").innerHTML="₹"+today;

document.getElementById("week").innerHTML="₹"+week;

document.getElementById("month").innerHTML="₹"+month;

document.getElementById("rides").innerHTML=rides;

}

function withdrawMoney(){

let today=parseInt(localStorage.getItem("todayEarning"))||0;

if(today==0){

alert("No earnings available.");

return;

}

alert("Withdrawal Request Submitted");

localStorage.setItem("todayEarning",0);

loadData();

}

loadData();

</script>

</body>
</html>
