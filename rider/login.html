<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dabido Rider Login</title>

<link rel="stylesheet" href="../style.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
width:90%;
max-width:400px;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
background:#16a34a;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#15803d;
}

a{
display:block;
margin-top:15px;
text-align:center;
text-decoration:none;
color:#16a34a;
}

</style>

</head>

<body>

<div class="box">

<h2>🚖 Rider Login</h2>

<input
type="tel"
id="mobile"
placeholder="Mobile Number">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

<a href="../register.html">
Create Rider Account
</a>

</div>

<script>

function login(){

let mobile=document.getElementById("mobile").value;

let password=document.getElementById("password").value;

if(mobile==""||password==""){

alert("Please fill all fields");

return;

}

let users=JSON.parse(localStorage.getItem("users"))||[];

let found=users.find(function(user){

return user.role==="Rider" &&
user.phone===mobile &&
user.password===password;

});

if(found){

localStorage.setItem("riderLogged","true");

localStorage.setItem("riderName",found.name);

alert("Login Successful");

window.location.href="index.html";

}else{

alert("Invalid Mobile Number or Password");

}

}

</script>

</body>

</html>
