<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manage Users</title>

<link rel="stylesheet" href="../style.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#111827;
color:white;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
padding:15px;
}

input{
width:100%;
padding:12px;
border:1px solid #ccc;
border-radius:8px;
margin-bottom:15px;
font-size:16px;
box-sizing:border-box;
}

.user-card{
background:white;
padding:15px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.user-card h3{
margin:0 0 10px;
}

.user-card p{
margin:5px 0;
}

.btn{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
margin-right:10px;
}

.edit{
background:#2563eb;
color:white;
}

.delete{
background:#dc2626;
color:white;
}

.back{
width:100%;
padding:14px;
background:#16a34a;
color:white;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
margin-top:20px;
}

</style>

</head>

<body>

<header>

👥 Manage Users

</header>

<div class="container">

<input
type="text"
id="search"
placeholder="Search User..."
onkeyup="searchUsers()">

<div id="userList"></div>

<button
class="back"
onclick="location.href='index.html'">

⬅ Back to Dashboard

</button>

</div>

<script>

let users =
JSON.parse(localStorage.getItem("users")) || [];

function loadUsers(data){

let html="";

if(data.length===0){

html="<h3>No Users Found</h3>";

}else{

data.forEach(function(user,index){

html+=`

<div class="user-card">

<h3>${user.name}</h3>

<p><b>Role:</b> ${user.role}</p>

<p><b>Phone:</b> ${user.phone}</p>

<p><b>Email:</b> ${user.email}</p>

<button class="btn edit"
onclick="editUser(${index})">

Edit

</button>

<button class="btn delete"
onclick="deleteUser(${index})">

Delete

</button>

</div>

`;

});

}

document.getElementById("userList").innerHTML=html;

}

function searchUsers(){

let key=
document.getElementById("search").value.toLowerCase();

let result=
users.filter(function(user){

return user.name.toLowerCase().includes(key) ||

user.phone.includes(key) ||

user.email.toLowerCase().includes(key);

});

loadUsers(result);

}

function deleteUser(index){

if(confirm("Delete this user?")){

users.splice(index,1);

localStorage.setItem("users",JSON.stringify(users));

loadUsers(users);

}

}

function editUser(index){

let name=
prompt("Edit Name",users[index].name);

if(name){

users[index].name=name;

localStorage.setItem("users",JSON.stringify(users));

loadUsers(users);

}

}

loadUsers(users);

</script>

</body>
</html>
