<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dabido Admin Settings</title>

<link rel="stylesheet" href="../style.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#111827;
color:#fff;
padding:16px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
padding:15px;
}

.card{
background:#fff;
padding:20px;
border-radius:12px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

label{
display:block;
margin-top:15px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
margin-top:8px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
margin-top:20px;
background:#16a34a;
color:#fff;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
}

.back{
background:#2563eb;
}

</style>

</head>

<body>

<header>

⚙️ Admin Settings

</header>

<div class="container">

<div class="card">

<label>App Name</label>
<input type="text" id="appName">

<label>Base Fare (₹)</label>
<input type="number" id="baseFare">

<label>Commission (%)</label>
<input type="number" id="commission">

<label>User Registration</label>
<select id="userRegistration">
<option value="ON">ON</option>
<option value="OFF">OFF</option>
</select>

<label>Rider Registration</label>
<select id="riderRegistration">
<option value="ON">ON</option>
<option value="OFF">OFF</option>
</select>

<label>Dark Mode</label>
<select id="darkMode">
<option value="OFF">OFF</option>
<option value="ON">ON</option>
</select>

<button onclick="saveSettings()">
💾 Save Settings
</button>

<button class="back" onclick="window.location='index.html'">
⬅ Back
</button>

</div>

</div>

<script>

function loadSettings(){

let settings=JSON.parse(localStorage.getItem("settings"))||{

appName:"Dabido",

baseFare:50,

commission:15,

userRegistration:"ON",

riderRegistration:"ON",

darkMode:"OFF"

};

document.getElementById("appName").value=settings.appName;
document.getElementById("baseFare").value=settings.baseFare;
document.getElementById("commission").value=settings.commission;
document.getElementById("userRegistration").value=settings.userRegistration;
document.getElementById("riderRegistration").value=settings.riderRegistration;
document.getElementById("darkMode").value=settings.darkMode;

}

function saveSettings(){

let settings={

appName:document.getElementById("appName").value,

baseFare:document.getElementById("baseFare").value,

commission:document.getElementById("commission").value,

userRegistration:document.getElementById("userRegistration").value,

riderRegistration:document.getElementById("riderRegistration").value,

darkMode:document.getElementById("darkMode").value

};

localStorage.setItem("settings",JSON.stringify(settings));

alert("Settings Saved Successfully");

}

loadSettings();

</script>

</body>
</html>
