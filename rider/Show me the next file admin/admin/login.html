<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dabido Admin Login</title>

<link rel="stylesheet" href="../style.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#111827;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
width:90%;
max-width:380px;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

h2{
text-align:center;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
margin-top:15px;
background:#16a34a;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#15803d;
}

.demo{
margin-top:20px;
padding:10px;
background:#f3f4f6;
border-radius:8px;
font-size:14px;
text-align:center;
}

</style>

</head>

<body>

<div class="login-box">

<h2>🔐 Admin Login</h2>

<input
type="text"
id="username"
placeholder="Admin Username">

<input
type="password"
id="password"
placeholder="Password">

<button onclick="login()">
Login
</button>

<div class="demo">
<b>Demo Login</b><br>
Username: admin<br>
Password: admin123
</div>

</div>

<script>

function login(){

let username=document.getElementById("username").value.trim();

let password=document.getElementById("password").value.trim();

if(username==="admin" && password==="admin123"){

localStorage.setItem("adminLogged","true");

alert("Admin Login Successful");

window.location.href="index.html";

}else{

alert("Invalid Username or Password");

}

}

</script>

</body>
</html>
