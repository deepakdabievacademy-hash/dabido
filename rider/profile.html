<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rider Profile</title>

<link rel="stylesheet" href="../style.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

header{
background:#16a34a;
color:#fff;
padding:16px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

.avatar{
width:120px;
height:120px;
border-radius:50%;
background:#ddd;
display:block;
margin:auto;
object-fit:cover;
}

h2{
text-align:center;
margin:15px 0;
}

input,select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
}

.save{
background:#16a34a;
color:#fff;
}

.logout{
background:#dc2626;
color:#fff;
}

</style>

</head>

<body>

<header>

🚖 Rider Profile

</header>

<div class="container">

<div class="card">

<img
class="avatar"
src="https://via.placeholder.com/120"
id="photo">

<h2 id="title">
Rider
</h2>

<input
type="text"
id="name"
placeholder="Full Name">

<input
type="tel"
id="phone"
placeholder="Mobile Number">

<input
type="text"
id="vehicle"
placeholder="Vehicle Number">

<select id="vehicleType">

<option>Bike</option>

<option>Auto</option>

<option>Cab</option>

</select>

<input
type="text"
id="license"
placeholder="Driving License Number">

<button
class="save"
onclick="saveProfile()">

Save Profile

</button>

<button
class="logout"
onclick="logout()">

Logout

</button>

</div>

</div>

<script>

function loadProfile(){

let rider=
JSON.parse(localStorage.getItem("riderProfile"));

if(rider){

document.getElementById("name").value=rider.name||"";
document.getElementById("phone").value=rider.phone||"";
document.getElementById("vehicle").value=rider.vehicle||"";
document.getElementById("vehicleType").value=rider.vehicleType||"Bike";
document.getElementById("license").value=rider.license||"";

}

}

function saveProfile(){

let rider={

name:document.getElementById("name").value,

phone:document.getElementById("phone").value,

vehicle:document.getElementById("vehicle").value,

vehicleType:document.getElementById("vehicleType").value,

license:document.getElementById("license").value

};

localStorage.setItem(
"riderProfile",
JSON.stringify(rider)
);

alert("Profile Saved Successfully");

}

function logout(){

localStorage.removeItem("riderLogged");

window.location.href="login.html";

}

loadProfile();

</script>

</body>
</html>
