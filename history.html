<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride History</title>

<link rel="stylesheet" href="style.css">

<style>
body{
background:#f5f5f5;
margin:0;
font-family:Arial,sans-serif;
}

header{
background:#111827;
color:#fff;
padding:16px;
font-size:22px;
font-weight:bold;
text-align:center;
}

.container{
padding:15px;
}

.ride-card{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

h3{
margin:0 0 10px;
}

p{
margin:6px 0;
}

button{
width:100%;
padding:14px;
background:#dc2626;
color:#fff;
border:none;
border-radius:10px;
font-size:16px;
cursor:pointer;
}
</style>

</head>
<body>

<header>
Ride History
</header>

<div class="container">

<div id="history"></div>

<button onclick="clearHistory()">
Clear History
</button>

</div>

<script>

function loadHistory(){

let rides=JSON.parse(localStorage.getItem("rides"))||[];

let html="";

if(rides.length==0){

html="<h2>No Ride History</h2>";

}else{

rides.forEach(function(ride){

html+=`

<div class="ride-card">

<h3>${ride.vehicle}</h3>

<p><b>Pickup:</b> ${ride.pickup}</p>

<p><b>Drop:</b> ${ride.drop}</p>

<p><b>Fare:</b> ${ride.fare}</p>

<p><b>Status:</b> ${ride.status}</p>

<p>${ride.date}</p>

</div>

`;

});

}

document.getElementById("history").innerHTML=html;

}

function clearHistory(){

if(confirm("Delete all rides?")){

localStorage.removeItem("rides");

loadHistory();

}

}

loadHistory();

</script>

</body>
</html>
