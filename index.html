<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dabido - Book Bike, Auto & Cab</title>

<link rel="stylesheet" href="style.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
}

header{
background:#FFD400;
padding:15px;
display:flex;
justify-content:space-between;
align-items:center;
position:sticky;
top:0;
}

.logo{
font-size:26px;
font-weight:bold;
}

.menu{
font-size:28px;
cursor:pointer;
}

.hero{
padding:20px;
}

.card{
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 2px 10px rgba(0,0,0,.15);
}

input,select{
width:100%;
padding:14px;
margin-top:10px;
border-radius:10px;
border:1px solid #ddd;
}

button{
width:100%;
padding:15px;
margin-top:15px;
background:#FFD400;
border:none;
border-radius:10px;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.vehicle{
display:flex;
gap:10px;
margin-top:20px;
}

.box{
flex:1;
background:white;
padding:15px;
text-align:center;
border-radius:12px;
cursor:pointer;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.box.active{
background:#FFD400;
}

.price{
margin-top:20px;
font-size:24px;
font-weight:bold;
text-align:center;
}

.history{
margin-top:30px;
background:white;
padding:20px;
border-radius:15px;
}

.item{
padding:10px;
border-bottom:1px solid #ddd;
}
</style>

</head>

<body>

<header>

<div class="logo">
🚕 Dabido
</div>

<div class="menu">
☰
</div>

</header>

<div class="hero">

<div class="card">

<h2>Book Your Ride</h2>

<input
type="text"
id="pickup"
placeholder="Pickup Location">

<input
type="text"
id="drop"
placeholder="Drop Location">

<select id="vehicle">

<option value="bike">Bike</option>

<option value="auto">
Auto
</option>

<option value="cab">
Cab
</option>

</select>

<div class="vehicle">

<div class="box active">
🏍️
<br>
Bike
</div>

<div class="box">
🛺
<br>
Auto
</div>

<div class="box">
🚗
<br>
Cab
</div>

</div>

<div class="price" id="fare">
Fare ₹0
</div>

<button onclick="bookRide()">
Book Ride
</button>

</div>

<div class="history">

<h2>Ride History</h2>

<div id="history">

No rides yet.

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
