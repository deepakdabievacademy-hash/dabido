<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dabido</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</head>

<body>

<header class="topbar">

<div class="logo">
🚖 Dabido
</div>

<div class="profile">

<a href="profile.html">👤</a>

</div>

</header>

<div id="map"></div>

<div class="booking">

<h2>Book Your Ride</h2>

<input
type="text"
id="pickup"
placeholder="Pickup Location">

<input
type="text"
id="drop"
placeholder="Destination">

<div class="vehicle">

<div class="vehicle-card" onclick="selectVehicle('Bike',80)">
🏍️
<h3>Bike</h3>
<p>₹80+</p>
</div>

<div class="vehicle-card" onclick="selectVehicle('Auto',120)">
🛺
<h3>Auto</h3>
<p>₹120+</p>
</div>

<div class="vehicle-card" onclick="selectVehicle('Cab',220)">
🚗
<h3>Cab</h3>
<p>₹220+</p>
</div>

</div>

<h3 id="selectedVehicle">
No vehicle selected
</h3>

<h2 id="fare">
Estimated Fare ₹0
</h2>

<button onclick="bookRide()">
Book Ride
</button>

</div>

<nav class="bottom">

<a href="index.html">
🏠
<br>
Home
</a>

<a href="history.html">
📖
<br>
History
</a>

<a href="profile.html">
👤
<br>
Profile
</a>

</nav>

<script src="script.js"></script>
<script src="map.js"></script>

</body>
</html>
