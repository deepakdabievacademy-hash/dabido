<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dabido Register</title>

<link rel="stylesheet" href="style.css">

<style>

body{
margin:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}

.container{
width:90%;
max-width:400px;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.15);
}

h2{
text-align:center;
margin-bottom:20px;
}

.tabs{
display:flex;
margin-bottom:20px;
}

.tabs button{
flex:1;
padding:12px;
border:none;
cursor:pointer;
background:#ddd;
font-size:16px;
}

.tabs button.active{
background:#16a34a;
color:#fff;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}

button.register{
width:100%;
padding:14px;
background:#16a34a;
color:#fff;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

a{
text-decoration:none;
color:#16a34a;
}

p{
text-align:center;
margin-top:15px;
}

</style>

</head>

<body>

<div class="container">

<h2>Create Account</h2>

<div class="tabs">

<button id="userBtn" class="active"
onclick="setRole('User')">
User
</button>

<button id="riderBtn"
onclick="setRole('Rider')">
Rider
</button>

</div>

<input
type="text"
id="name"
placeholder="Full Name">

<input
type="tel"
id="phone"
placeholder="Mobile Number">

<input
type="email"
id="email"
placeholder="Email">

<input
type="password"
id="password"
placeholder="Password">

<button
class="register"
onclick="register()">

Register

</button>

<p>

Already have an account?

<a href="login.html">

Login

</a>

</p>

</div>

<script>

let role="User";

function setRole(type){

role=type;

document.getElementById("userBtn").classList.remove("active");
document.getElementById("riderBtn").classList.remove("active");

if(type==="User"){
document.getElementById("userBtn").classList.add("active");
}else{
document.getElementById("riderBtn").classList.add("active");
}

}

function register(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let email=document.getElementById("email").value;
let password=document.getElementById("password").value;

if(name==""||phone==""||email==""||password==""){
alert("Please fill all fields");
return;
}

let users=
JSON.parse(localStorage.getItem("users"))||[];

users.push({

role:role,

name:name,

phone:phone,

email:email,

password:password

});

localStorage.setItem("users",JSON.stringify(users));

alert(role+" Registered Successfully");

window.location.href="login.html";

}

</script>

</body>
</html>
